# 作用：在 GitHub Actions 中自动构建生产（release）arm64-v8a 架构 APK，并上传产物。
name: Build Production ARM64-v8a APK

on:
  # 支持手动触发，便于按需发版。
  workflow_dispatch:
  # 主分支提交后自动构建生产包。
  push:
    branches:
      - main

jobs:
  build-production-arm64-v8a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python 3.10
        run: |
          python --version
          python3.10 --version

      - name: Validate Signing Secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")) { throw "缺少 ANDROID_KEYSTORE_BASE64 secret" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEY_ALIAS }}")) { throw "缺少 ANDROID_KEY_ALIAS secret" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_PASSWORD }}")) { throw "缺少 ANDROID_KEYSTORE_PASSWORD secret" }

      - name: Prepare Keystore
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD/release.jks", [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}"))

      - name: Generate local.properties
        shell: pwsh
        run: |
          @(
            "sdk.dir=$env:ANDROID_HOME"
            "storeFile=release.jks"
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ) | Set-Content -Encoding UTF8 local.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APKs (arm64-v8a)
        run: ./gradlew --no-daemon :app:assembleLeanbackArm64_v8aRelease :app:assembleMobileArm64_v8aRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-arm64-v8a-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/**/arm64_v8a/release/*.apk
            Release/apk/*.apk
